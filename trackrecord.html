<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Citadel Alpha Track Record — Equity curve, drawdown, et détail de tous les trades." />
  <title>Track Record | Citadel Alpha</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Syne:wght@700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; overflow-x: hidden; background: #050508; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #050508; color: #e3e3e3; margin: 0; }
    .font-display { font-family: 'Syne', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .count-up { font-variant-numeric: tabular-nums; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #050508; }
    ::-webkit-scrollbar-thumb { background: #1a1a2e; border-radius: 2px; }
  </style>
</head>
<body>
  <nav style="position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(5,5,8,0.85);backdrop-filter:blur(24px);border-bottom:1px solid rgba(255,255,255,0.04);">
    <div style="max-width:1280px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;">
      <a href="index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;">
        <span style="font-family:'Syne',sans-serif;font-size:20px;font-weight:800;letter-spacing:-0.5px;color:#fff;">CITADEL</span>
        <span style="font-family:'Inter',sans-serif;font-size:11px;font-weight:400;color:#6b7280;letter-spacing:2px;text-transform:uppercase;border-left:1px solid rgba(255,255,255,0.1);padding-left:10px;">Track Record</span>
      </a>
      <a href="index.html" style="color:#6b7280;font-size:13px;text-decoration:none;">&larr; Retour</a>
    </div>
  </nav>

  <div style="padding-top:80px;">
    <div style="max-width:1280px;margin:0 auto;padding:40px 24px;">
      <div style="text-align:center;margin-bottom:40px;">
        <h1 style="font-family:'Syne',sans-serif;font-size:clamp(2rem,4vw,3.5rem);font-weight:800;color:#fff;margin:0 0 12px;">Track Record</h1>
        <p style="color:#6b7280;font-size:14px;">Equity curve <span style="color:#4b5563;">/</span> Drawdown <span style="color:#4b5563;">/</span> Trades</p>
      </div>

      <div id="summary-cards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px;border:1px solid rgba(255,255,255,0.04);border-radius:4px;overflow:hidden;margin-bottom:40px;">
        <div style="background:#08080d;padding:24px;text-align:center;">
          <div style="font-size:10px;color:#6b7280;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;">Capital final</div>
          <div class="font-mono" style="font-size:24px;font-weight:700;color:#22c55e;" id="s_final">&mdash;</div>
          <div style="font-size:11px;color:#4b5563;margin-top:4px;" id="s_total">&mdash;</div>
        </div>
        <div style="background:#08080d;padding:24px;text-align:center;">
          <div style="font-size:10px;color:#6b7280;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;">CAGR</div>
          <div class="font-mono" style="font-size:24px;font-weight:700;color:#fff;" id="s_cagr">&mdash;</div>
          <div style="font-size:11px;color:#4b5563;margin-top:4px;" id="s_alpha">&mdash;</div>
        </div>
        <div style="background:#08080d;padding:24px;text-align:center;">
          <div style="font-size:10px;color:#6b7280;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;">Max Drawdown</div>
          <div class="font-mono" style="font-size:24px;font-weight:700;color:#fb923c;" id="s_dd">&mdash;</div>
        </div>
        <div style="background:#08080d;padding:24px;text-align:center;">
          <div style="font-size:10px;color:#6b7280;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;">Trades / WR / PF</div>
          <div style="font-size:14px;font-weight:600;color:#fff;margin-top:4px;" id="s_misc">&mdash;</div>
        </div>
      </div>

      <div id="error-box" style="display:none;background:rgba(239,68,68,0.05);border:1px solid rgba(239,68,68,0.15);border-radius:4px;padding:16px;font-size:13px;color:#fca5a5;margin-bottom:24px;"></div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:40px;">
        <div style="background:#08080d;padding:20px;border:1px solid rgba(255,255,255,0.04);border-radius:4px;">
          <div style="font-size:11px;color:#6b7280;margin-bottom:12px;text-transform:uppercase;letter-spacing:1px;">Equity Curve vs SPY</div>
          <canvas id="equityChart" height="140"></canvas>
        </div>
        <div style="background:#08080d;padding:20px;border:1px solid rgba(255,255,255,0.04);border-radius:4px;">
          <div style="font-size:11px;color:#6b7280;margin-bottom:12px;text-transform:uppercase;letter-spacing:1px;">Drawdown</div>
          <canvas id="ddChart" height="140"></canvas>
        </div>
      </div>

      <div style="margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap;">
        <input id="q" placeholder="Rechercher ticker, date..." style="flex:1;min-width:200px;background:#08080d;border:1px solid rgba(255,255,255,0.08);border-radius:4px;padding:10px 14px;font-size:13px;color:#e3e3e3;outline:none;">
        <select id="pageSize" style="background:#08080d;border:1px solid rgba(255,255,255,0.08);border-radius:4px;padding:10px;font-size:13px;color:#e3e3e3;outline:none;">
          <option value="50">50/page</option><option value="100" selected>100/page</option><option value="200">200/page</option>
        </select>
      </div>
      <div style="background:#08080d;border:1px solid rgba(255,255,255,0.04);border-radius:4px;overflow:hidden;">
        <div style="overflow-x:auto;">
          <table style="width:100%;font-size:12px;border-collapse:collapse;">
            <thead><tr style="background:#050508;color:#6b7280;text-align:left;"><th style="padding:12px 14px;font-weight:600;">#</th><th style="padding:12px 14px;font-weight:600;">Ticker</th><th style="padding:12px 14px;font-weight:600;">Entr&eacute;e</th><th style="padding:12px 14px;font-weight:600;">Prix E</th><th style="padding:12px 14px;font-weight:600;">Sortie</th><th style="padding:12px 14px;font-weight:600;">Prix S</th><th style="padding:12px 14px;font-weight:600;">Raison</th><th style="padding:12px 14px;font-weight:600;">PnL%</th><th style="padding:12px 14px;font-weight:600;">PnL$</th><th style="padding:12px 14px;font-weight:600;">Dur&eacute;e</th></tr></thead>
            <tbody id="tbody" style="color:#d1d5db;"></tbody>
          </table>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-top:1px solid rgba(255,255,255,0.04);font-size:12px;color:#6b7280;">
          <div id="pageInfo">&mdash;</div>
          <div style="display:flex;gap:8px;">
            <button id="prev" style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:4px;padding:6px 14px;color:#e3e3e3;cursor:pointer;font-size:12px;">Prev</button>
            <button id="next" style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:4px;padding:6px 14px;color:#e3e3e3;cursor:pointer;font-size:12px;">Next</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUMMARY_URL = './backtest/summary.json';
    const EQUITY_URL = './backtest/equity_curve.json';
    const SPY_URL = './backtest/spy_curve.json';
    const TRADES_URL = './backtest/all_trades.json';

    async function loadSummary() {
      const r = await fetch(SUMMARY_URL, { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const s = await r.json();
      document.getElementById('s_final').textContent = Number(s.final_equity).toLocaleString('fr-FR',{maximumFractionDigits:0})+' €';
      document.getElementById('s_total').textContent = 'ROI +'+Number(s.total_return_pct).toFixed(0)+'%';
      document.getElementById('s_cagr').textContent = Number(s.cagr_pct).toFixed(1)+'%';
      document.getElementById('s_alpha').textContent = 'Alpha '+Number(s.alpha_vs_spy_pts).toFixed(1)+' pts';
      document.getElementById('s_dd').textContent = '-'+Math.abs(Number(s.max_drawdown_pct)).toFixed(1)+'%';
      document.getElementById('s_misc').textContent = s.trades+' trades · '+Number(s.win_rate_pct).toFixed(1)+'% · PF '+Number(s.profit_factor).toFixed(2);
      return s;
    }

    let equityChart = null, ddChart = null;
    async function loadCharts() {
      const [eqRes, spyRes] = await Promise.all([
        fetch(EQUITY_URL, { cache: 'no-store' }),
        fetch(SPY_URL, { cache: 'no-store' })
      ]);
      if (!eqRes.ok) throw new Error('equity HTTP '+eqRes.status);
      if (!spyRes.ok) throw new Error('spy HTTP '+spyRes.status);
      const eq = await eqRes.json();
      const sp = await spyRes.json();
      const spyMap = new Map(sp.map(x => [x.date, Number(x.spy_equity)]));
      const labels = eq.map(x => x.date);
      const strategy = eq.map(x => Number(x.equity));
      const spyScaled = eq.map(x => spyMap.get(x.date) ?? null);
      const dd = eq.map(x => { const v = x.drawdown ?? x.drawdown_pct ?? null; return v !== null ? Number(v) : null; });

      if (equityChart) { equityChart.destroy(); }
      if (ddChart) { ddChart.destroy(); }

      const ctx1 = document.getElementById('equityChart');
      equityChart = new Chart(ctx1, {
        type: 'line',
        data: { labels, datasets: [
          { label: 'Stratégie', data: strategy, borderColor: '#22c55e', backgroundColor: 'rgba(34,197,94,0.06)', borderWidth: 1.5, pointRadius: 0, tension: 0.15 },
          { label: 'SPY (scaled)', data: spyScaled, borderColor: '#6b7280', borderWidth: 1, pointRadius: 0, tension: 0.15, borderDash: [4,4] }
        ]},
        options: { responsive: true, interaction: { mode: 'index', intersect: false }, plugins: { legend: { labels: { color: '#9ca3af', font: { size: 11 } } }, tooltip: { callbacks: { label: ctx => ctx.dataset.label+': '+Number(ctx.raw).toLocaleString('fr-FR',{maximumFractionDigits:0})+' €' } } }, scales: { x: { ticks: { color: '#6b7280', maxTicksLimit: 8, font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.03)' } }, y: { ticks: { color: '#6b7280', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.03)' } } } }
      });

      const ctx2 = document.getElementById('ddChart');
      ddChart = new Chart(ctx2, {
        type: 'line',
        data: { labels, datasets: [{ label: 'Drawdown', data: dd, borderColor: '#fb923c', backgroundColor: 'rgba(251,146,60,0.08)', borderWidth: 1.5, pointRadius: 0, tension: 0.15 }] },
        options: { responsive: true, interaction: { mode: 'index', intersect: false }, plugins: { legend: { labels: { color: '#9ca3af', font: { size: 11 } } }, tooltip: { callbacks: { label: ctx => 'Drawdown: '+Number(ctx.raw).toFixed(2)+'%' } } }, scales: { x: { ticks: { color: '#6b7280', maxTicksLimit: 8, font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.03)' } }, y: { ticks: { color: '#6b7280', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.03)' } } } }
      });
    }

    let allTrades = [], filtered = [], page = 1;
    const qEl = document.getElementById('q'), pageSizeEl = document.getElementById('pageSize'), tbody = document.getElementById('tbody'), pageInfo = document.getElementById('pageInfo');
    function getPageSize() { return Number(pageSizeEl.value || 100); }
    function applyFilter() {
      const q = (qEl.value||'').trim().toLowerCase();
      filtered = q ? allTrades.filter(t => [t.ticker,t.entry_date,t.exit_date,t.exit_reason].join(' ').toLowerCase().includes(q)) : allTrades.slice();
      filtered.sort((a,b) => (String(b.entry_date||'')).localeCompare(String(a.entry_date||'')));
      page = 1; render();
    }
    function render() {
      const ps = getPageSize(), total = filtered.length, tp = Math.max(1, Math.ceil(total/ps));
      page = Math.min(Math.max(1,page), tp);
      const start = (page-1)*ps, end = Math.min(start+ps, total);
      const slice = filtered.slice(start, end);
      tbody.innerHTML = '';
      const frag = document.createDocumentFragment();
      slice.forEach((t,i) => {
        const pnl = Number(t.pnl_pct), pnlD = t.pnl_$ !== undefined ? Number(t.pnl_$) : (pnl/100)*5000;
        const cls = isFinite(pnl) && pnl >= 0 ? '#22c55e' : '#ef4444';
        const trEl = document.createElement('tr');
        trEl.style.borderTop = '1px solid rgba(255,255,255,0.03)';
        trEl.innerHTML = '<td style="padding:10px 12px;color:#4b5563;font-family:JetBrains Mono,monospace;">'+(start+i+1)+'</td><td style="padding:10px 12px;font-weight:600;font-family:JetBrains Mono,monospace;">'+(t.ticker||'')+'</td><td style="padding:10px 12px;font-family:JetBrains Mono,monospace;">'+(t.entry_date||'')+'</td><td style="padding:10px 12px;font-family:JetBrains Mono,monospace;">'+(isFinite(Number(t.entry_price))?Number(t.entry_price).toFixed(2):'')+'</td><td style="padding:10px 12px;font-family:JetBrains Mono,monospace;">'+(t.exit_date||'')+'</td><td style="padding:10px 12px;font-family:JetBrains Mono,monospace;">'+(isFinite(Number(t.exit_price))?Number(t.exit_price).toFixed(2):'')+'</td><td style="padding:10px 12px;color:#9ca3af;">'+(t.exit_reason||'')+'</td><td style="padding:10px 12px;font-weight:600;font-family:JetBrains Mono,monospace;color:'+cls+';">'+(isFinite(pnl)?pnl.toFixed(2):'')+'%</td><td style="padding:10px 12px;font-family:JetBrains Mono,monospace;color:'+cls+';">'+(isFinite(pnlD)?pnlD.toFixed(2):'')+'</td><td style="padding:10px 12px;color:#6b7280;font-family:JetBrains Mono,monospace;">'+(t.holding_days||'')+'</td>';
        frag.appendChild(trEl);
      });
      tbody.appendChild(frag);
      pageInfo.textContent = 'Page '+page+'/'+tp+' · '+filtered.length+' trades ('+(start+1)+'-'+end+')';
    }

    async function loadTrades() {
      const r = await fetch(TRADES_URL, { cache: 'no-store' });
      if (!r.ok) throw new Error('trades HTTP '+r.status);
      allTrades = await r.json();
      filtered = allTrades.slice();
      applyFilter();
    }

    document.getElementById('prev').addEventListener('click', () => { page--; render(); });
    document.getElementById('next').addEventListener('click', () => { page++; render(); });
    qEl.addEventListener('input', () => applyFilter());
    pageSizeEl.addEventListener('change', () => applyFilter());

    (async function init() {
      try {
        await loadSummary();
        await loadCharts();
        await loadTrades();
      } catch(e) {
        const box = document.getElementById('error-box');
        box.style.display = 'block';
        box.textContent = 'Erreur : '+e.message;
      }
    })();
  </script>
</body>
</html>
